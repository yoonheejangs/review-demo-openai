<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<script src="auth.js" defer></script>
<script src="common.js" defer></script>
<title>조건별 실험 흐름</title>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6">
<div class="max-w-7xl mx-auto">
  <div id="top-nav"></div>
  <header class="soft-card-lg p-7 mb-6">
    <span class="group-badge bg-violet-100 text-violet-700">Experiment Flow</span>
    <h1 class="text-3xl font-bold text-slate-800 mt-3">조건별 실험 화면 선택</h1>
    <p class="text-slate-500 mt-2">심사위원께서는 아래 세 조건을 각각 눌러 실제 참여자가 경험한 처치의 차이를 확인하실 수 있습니다.</p>
  </header>
  <div class="grid lg:grid-cols-3 gap-5">
    <a href="group1-demo.html" class="soft-card p-6 hover:shadow-lg transition">
      <span class="group-badge bg-slate-200 text-slate-700">Control</span>
      <h2 class="font-bold text-xl mt-4">기본 가이드 조건</h2>
      <p class="text-sm text-slate-500 mt-2">학습 안내 영상을 본 뒤 목표 이미지를 선택하고 자유롭게 프롬프트를 작성합니다.</p>
      <img src="img/group1.png" class="mt-4 rounded-xl border">
    </a>
    <a href="group2-demo.html" class="soft-card p-6 hover:shadow-lg transition">
      <span class="group-badge bg-blue-100 text-blue-700">Context</span>
      <h2 class="font-bold text-xl mt-4">블록 조립 조건</h2>
      <p class="text-sm text-slate-500 mt-2">블록을 선택하면 문장 구조가 안내되고, 학습자는 이를 직접 타이핑하며 구조를 학습합니다.</p>
      <img src="img/group2.png" class="mt-4 rounded-xl border">
    </a>
    <a href="group3-demo.html" class="soft-card p-6 hover:shadow-lg transition">
      <span class="group-badge bg-green-100 text-green-700">Advanced</span>
      <h2 class="font-bold text-xl mt-4">심화 도전 조건</h2>
      <p class="text-sm text-slate-500 mt-2">초급·중급·고급 도전을 통해 이미지 프롬프트를 점차 정교화합니다.</p>
      <img src="img/group3.png" class="mt-4 rounded-xl border">
    </a>
  </div>
</div>
<script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('top-nav').innerHTML=buildTopNav('flow');});</script>
</body></html>
