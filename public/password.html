<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<script src="auth.js" defer></script><script src="common.js" defer></script>
<title>심사위원용 비밀번호</title></head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50">
<div class="w-full max-w-lg soft-card-lg p-8 md:p-10 fade-in">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-700 text-2xl mb-4"><i class="fa-solid fa-user-shield"></i></div>
    <h1 class="text-3xl font-bold text-slate-800 mb-2">심사위원 전용 데모 접속</h1>
    <p class="text-slate-500 text-sm leading-relaxed">본 페이지는 석사학위논문 심사위원용으로 별도 구성된 데모 환경입니다.<br>비밀번호를 입력하면 실험 UI와 OpenAI 기반 체험 기능을 확인하실 수 있습니다.</p>
  </div>
  <div class="info-callout text-sm mb-5">
    <strong>안내</strong><br>
    • 이 데모는 연구 원자료와 완전히 분리되어 있습니다.<br>
    • 입력 내용은 Google Sheet에 저장되지 않습니다.<br>
  </div>
  <form id="password-form" class="space-y-4">
    <div>
      <label class="block font-bold text-slate-700 mb-2">접속 비밀번호</label>
      <input id="password-input" type="password" class="w-full p-4 border rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none" placeholder="비밀번호를 입력하세요">
      <p class="text-xs text-slate-400 mt-2">기본값 예시: <span class="code-badge">review2026!</span></p>
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition">입장하기</button>
  </form>
  <div id="password-error" class="hidden mt-4 warn-callout text-sm"></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('password-form');
  const input = document.getElementById('password-input');
  const box = document.getElementById('password-error');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value === REVIEW_DEMO_PASSWORD) {
      grantReviewAccess();
      window.location.href = 'index.html';
    } else {
      box.classList.remove('hidden');
      box.innerHTML = '<strong>비밀번호가 올바르지 않습니다.</strong><br>심사위원용으로 전달받은 비밀번호를 다시 확인해 주세요.';
      input.focus();
    }
  });
});
</script>
</body></html>
